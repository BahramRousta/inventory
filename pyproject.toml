[project]
name = "inventory-reservation-service"
version = "0.1.0"
description = "Inventory reservation service interview assignment"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.128,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "alembic>=1.18,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "asyncpg>=0.31.0",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests/e2e", "tests/integration"]
markers = [
  "postgres: requires a PostgreSQL TEST_DATABASE_URL",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
